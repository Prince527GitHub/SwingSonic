name: Build Docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN != '' && secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute Tags
        id: tags
        run: |
          NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="${{ vars.REGISTRY }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            LATEST_TAG=$(git tag --list "v*" | sort -V | tail -n1)
            TAGS="${REGISTRY}/${NAME}:${VERSION}"
            [ "v$VERSION" = "$LATEST_TAG" ] && TAGS="${TAGS}${IFS}${REGISTRY}/${NAME}:latest"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DEFAULT_BRANCH=$(gh api repos/${{ github.repository }}/default_branch --jq '.name')
            BRANCH="${GITHUB_REF_NAME}"
            if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
              TAGS="${REGISTRY}/${NAME}:dev${IFS}${REGISTRY}/${NAME}:dev-${SHORT_SHA}"
            else
              TAG=$(echo "$BRANCH" | tr '/' '-')
              TAGS="${REGISTRY}/${NAME}:${TAG}${IFS}${REGISTRY}/${NAME}:${TAG}-${SHORT_SHA}"
            fi
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
